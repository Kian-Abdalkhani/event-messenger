services:
  event-messenger:
    container_name: event-messenger
    image: event-messenger:latest
    build: .
    network_mode: host
    volumes:
      - ./data:/app/data
      - tailscale-socket:/var/run/tailscale
    environment:
      - GO_ENV=production
      - TZ=America/Los_Angeles
      - DEBUG=${DEBUG}
      - BASE_URL=${BASE_URL}
      - WEB_PORT=${WEB_PORT:-8080}
      - DB_PATH=${DB_PATH:-./data/app.db}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM_EMAIL}
    restart: unless-stopped
  tailscale:
    container_name: ts
    image: tailscale/tailscale:latest
    network_mode: host
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
    volumes:
      - tailscale-socket:/var/run/tailscale
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    command: >
      sh -c "
        mkdir -p /var/run/tailscale &&
        mkdir -p /var/lib/tailscale &&
        tailscaled --socket=/var/run/tailscale/tailscaled.sock --state=/var/lib/tailscale/tailscaled.state &
        sleep 5 &&
        tailscale up --authkey=$${TS_AUTHKEY} --hostname=event-messenger-ts --accept-routes &&
        sleep 2 &&
        tailscale serve reset &&
        tailscale funnel --bg --https=443 127.0.0.1:8080 &&
        wait
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/tailscale/tailscaled.sock"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  tailscale-socket:
  tailscale-state:
