<!DOCTYPE html>
<html>
  <head>
    <title>Event Submission Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <h1>Submit Your Message</h1>
      <p class="subtitle">For {{.RecipientName}}'s {{.EventName}}</p>
    </header>

    <div class="form-container">
      <form
        action="/events/{{.EventSlug}}/submit"
        method="POST"
        enctype="multipart/form-data"
      >
        <div class="form-group">
          <label for="name">Your Name:</label>
          <input
            type="text"
            id="name"
            name="name"
            maxlength="100"
            placeholder="Enter your name"
            required
          />
        </div>

        <div class="form-group">
          <label for="message">Your Message:</label>
          <textarea
            id="message"
            name="message"
            maxlength="500"
            placeholder="Share your congratulations message..."
            required
          ></textarea>
          <small id="charCount" class="char-count">0 / 500 characters</small>
        </div>

        <div class="form-group">
          <label for="image">Upload Image:</label>
          <input
            type="file"
            id="image"
            name="image"
            accept="image/*"
            required
          />
        </div>

        <input type="submit" value="Submit Message" class="submit-btn" />
      </form>
    </div>
    <script src="/static/submit_form.js"></script>
  </body>
</html>
